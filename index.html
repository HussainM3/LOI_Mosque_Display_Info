<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Light of Islam – Iqama Times</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;cursor:none;font-family:Georgia,"Times New Roman",serif}
#st{position:absolute;width:1920px;height:1080px;transform-origin:0 0;display:flex;background:#0b3d2e;color:#fff}
aside{width:430px;background:#0f5a3f;border-right:14px solid #e0b84a;padding:40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:16px;font-size:30px;letter-spacing:2px;color:#e0b84a;align-self:flex-start;text-align:left}
.brand svg{width:84px}
.brand small{display:block;font-size:18px;color:#fff;letter-spacing:4px}
.big{width:300px;margin:110px 0 auto}
.note{font:italic 30px Arial,sans-serif;margin-bottom:30px}
.site{font:30px Arial,sans-serif;color:#cfeee0}
main{flex:1;display:flex;flex-direction:column}
header{height:170px;padding:36px 50px}
h1{font-size:44px;letter-spacing:2px}
#sub{color:#e0b84a;font:26px Arial,sans-serif;margin-top:14px}
#tbl{flex:1;display:grid;grid-template-columns:230px repeat(5,1fr);grid-template-rows:70px;grid-auto-rows:1fr;font-family:Arial,sans-serif;color:#222}
#tbl div{display:flex;align-items:center;justify-content:center;text-align:center;font-size:38px;background:#e8f1f2;border:1px solid #fff}
#tbl .h{background:#2e9e7a;color:#fff;font-size:26px;font-weight:bold;letter-spacing:2px}
#tbl .p{background:#e0b84a;font:bold 34px Georgia,serif}
#tbl .now{background:#fff3c4;font-weight:bold}
.bot{height:330px;display:flex}
.ann{flex:1.1;background:#e8f1f2;color:#222;padding:30px 40px;overflow:hidden}
.ann h2,.don h2{font-size:34px;letter-spacing:2px;color:#0f5a3f;margin-bottom:18px}
.ann ol{font:32px/1.4 Arial,sans-serif;padding-left:40px}
.don{flex:1;background:#0b3d2e;padding:30px 40px;font:28px Arial,sans-serif}
.don h2{color:#e0b84a}
.don .to{margin-top:24px;color:#e0b84a}
.don b{display:block;margin-top:12px;font-size:38px}
</style></head><body>
<div id="st">
<aside>
 <div class="brand"><svg viewBox="0 0 200 200"><path fill="#e0b84a" d="M142.9 32.5A80 80 0 1 0 142.9 167.5A68 68 0 1 1 142.9 32.5Z"/></svg><div>LIGHT OF ISLAM<small>ASSOCIATION</small></div></div>
 <svg class="big" viewBox="0 0 200 200"><path fill="#e0b84a" d="M142.9 32.5A80 80 0 1 0 142.9 167.5A68 68 0 1 1 142.9 32.5Z"/><polygon fill="#e0b84a" points="165,51 170.9,66.9 187.8,67.6 174.5,78.1 179.1,94.4 165,85 150.9,94.4 155.5,78.1 142.2,67.6 159.1,66.9"/></svg>
 <p class="note" id="note"></p><p class="site" id="site"></p>
</aside>
<main>
 <header><h1 id="title"></h1><div id="sub"></div></header>
 <div id="tbl"></div>
 <div class="bot">
  <div class="ann"><h2>ANNOUNCEMENT</h2><ol id="ann"></ol></div>
  <div class="don"><h2>DONATION</h2><p id="dt"></p><p class="to">E-transfer to:</p><b id="de"></b></div>
 </div>
</main>
</div>
<script>
// ===== SETTINGS: paste your published Google Sheet CSV link between the quotes =====
var SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQcclBbjV_qZxkDS5uV_iH2AevMCtVqc5gRrBsSE-RDKq4FmJXf4fZ_fUg1HlqOeQ_icOtnizcohu_P/pub?gid=1561846719&single=true&output=csv";
var REFRESH_MINUTES = 5;
// ===================================================================================

var DEFAULT_CSV = [
"type,a,b,c,d,e,f",
"setting,title,LIGHT OF ISLAM — IQAMA TIME FOR THE MONTH",
"setting,note,★ Maghrib at Sunset",
"setting,website,lightofislamcanada.org",
"setting,donation_text,Support your community — all donations are greatly appreciated.",
"setting,donation_email,financialsec@lightofislamcanada.org",
"period,Oct 1-10,6:30 am,2:00 pm,5:00 pm,Sunset ~6:55 pm,8:30 pm",
"period,Oct 11-20,6:30 am,2:00 pm,5:00 pm,Sunset ~6:35 pm,8:15 pm",
"period,Oct 21-30,6:40 am,2:00 pm,4:30 pm,Sunset ~6:18 pm,8:00 pm",
"announcement,Weekly Sunday Prayer (Asalatu) – 12:30pm"
].join("\n");

var $ = function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function parseCSV(t){var r=[],row=[],c="",q=false,i,ch;
 for(i=0;i<t.length;i++){ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch=='"')q=true;
  else if(ch==','){row.push(c);c=""}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=""}
  else c+=ch}
 row.push(c);r.push(row);return r}

var MON=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function isNow(label){
 var m=label.match(/([a-z]{3})[a-z]*\.?\s*(\d+)\s*[-–—]\s*(\d+)/i); if(!m)return false;
 var d=new Date();
 return MON.indexOf(m[1].toLowerCase())==d.getMonth()&&d.getDate()>=+m[2]&&d.getDate()<=+m[3]}

function autoSub(){
 var d=new Date(),s="";
 try{s=d.toLocaleDateString("en-CA",{month:"long",year:"numeric"}).toUpperCase()}catch(e){}
 try{s+="  •  "+new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{month:"long",year:"numeric"}).format(d).replace(/\s*(AH|ah)$/,"")}catch(e){}
 return s}

var CSV=DEFAULT_CSV;
function render(){
 var S={},P=[],A=[];
 parseCSV(CSV).forEach(function(r){r=r.map(function(x){return x.trim()});var t=(r[0]||"").toLowerCase();
  if(t=="setting")S[r[1]]=r[2]||"";
  else if(t=="period"&&r[1])P.push(r.slice(1,7));
  else if(t=="announcement"&&r[1])A.push(r[1])});
 $("title").textContent=S.title||"IQAMA TIMES";
 $("sub").textContent=S.subtitle||autoSub();
 $("note").textContent=S.note||"";
 $("site").textContent=S.website||"";
 $("dt").textContent=S.donation_text||"";
 $("de").textContent=S.donation_email||"";
 $("ann").innerHTML=A.map(function(a){return "<li>"+esc(a)+"</li>"}).join("");
 var h="";["PERIOD","FAJR","ZUHR","ASR","MAGHRIB","ISHA"].forEach(function(x){h+='<div class="h">'+x+'</div>'});
 P.forEach(function(r){var n=isNow(r[0])?" now":"";
  for(var i=0;i<6;i++)h+='<div class="'+(i?"c":"p")+n+'">'+esc(r[i]||"")+'</div>'});
 $("tbl").innerHTML=h}

function load(){
 if(!SHEET_CSV_URL)return;
 fetch(SHEET_CSV_URL+(SHEET_CSV_URL.indexOf("?")>0?"&":"?")+"t="+Date.now())
  .then(function(r){if(!r.ok)throw 0;return r.text()})
  .then(function(t){if(t.indexOf("type")<0)throw 0;CSV=t;try{localStorage.setItem("csv",t)}catch(e){}render()})
  .catch(function(){})}

function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080),st=$("st").style;
 st.transform="scale("+s+")";st.left=(innerWidth-1920*s)/2+"px";st.top=(innerHeight-1080*s)/2+"px"}

try{var c=localStorage.getItem("csv");if(c&&SHEET_CSV_URL)CSV=c}catch(e){}
addEventListener("resize",fit);fit();render();load();
setInterval(load,REFRESH_MINUTES*60000);
setInterval(render,60000);
function fs(){try{document.documentElement.requestFullscreen()}catch(e){}}
addEventListener("click",fs);addEventListener("keydown",function(e){if(e.key=="f"||e.key=="F")fs()});
</script></body></html>
